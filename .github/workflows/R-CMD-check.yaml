on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

name: R-CMD-check

permissions:
  contents: read

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.config.os }}

    name: ${{ matrix.config.os }} (${{ matrix.config.r }})

    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: windows-latest, r: 'release'}
          - {os: macOS-latest, r: 'release'}
          - {os: ubuntu-latest, r: 'release'}
          - {os: ubuntu-latest, r: 'oldrel-1'}

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          use-public-rspm: true

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check

      - name: Verify generated analysis directories are absent from source tarball
        if: runner.os == 'Linux' && matrix.config.r == 'release'
        shell: bash
        run: |
          set -euo pipefail
          R CMD build . --no-build-vignettes >/tmp/semantica-build.log
          tarball="$(ls -t SEMANTICA_*.tar.gz | head -n 1)"
          bad="$(tar -tzf "$tarball" | grep -E '/SEMANTICA_([0-9]+\.[0-9]+\.[0-9]+_.*_test|frozen_.*_test)(/|$)' || true)"
          rm -f "$tarball"
          if [ -n "$bad" ]; then
            printf 'Generated analysis/test artifacts entered the source tarball:\n%s\n' "$bad"
            exit 1
          fi

      - uses: r-lib/actions/check-r-package@v2
        with:
          args: 'c("--no-manual")'
